<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    >
    <meta name="theme-color" content="#030504">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flangame">
    <title>Flangame</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="game-wrap" aria-label="Flangame game area">
      <canvas id="game" width="480" height="270" aria-label="Flangame"></canvas>
      <div class="crt" aria-hidden="true"></div>

      <div id="system-controls" aria-label="Game controls">
        <button id="pause-button" type="button" aria-label="Pause game" title="Pause">Ⅱ</button>
        <button id="music-button" type="button" aria-label="Toggle music" title="Music">♪</button>
        <button id="fx-button" type="button" aria-label="Toggle low bitrate effect" title="Low bitrate effect">8</button>
      </div>

      <section id="start-screen" class="terminal-panel" aria-labelledby="game-title">
        <div class="title-mark" aria-hidden="true">
          <span>F</span><i></i><i></i><i></i><i></i><i></i>
        </div>
        <h1 id="game-title">FLANGAME</h1>
        <p id="start-status">BALTIMORE // NO JOBS // DON'T FEED THE GREEN</p>
        <button id="start-button" type="button">START</button>
        <p class="desktop-keys">MOVE WASD/ARROWS · JAM SPACE · USE E · SKILL SHIFT · SWITCH Q</p>
      </section>

      <section id="pause-screen" class="terminal-panel" hidden aria-labelledby="pause-title">
        <h2 id="pause-title">PAUSED_</h2>
        <div class="pause-actions">
          <button id="resume-button" type="button">RESUME</button>
          <button id="reset-position-button" type="button">UNSTUCK</button>
          <button id="new-game-button" type="button">NEW GAME</button>
        </div>
      </section>

      <div id="bandcamp-fallback" hidden>
        <button id="close-bandcamp" type="button" aria-label="Hide Bandcamp player">×</button>
        <iframe
          id="bandcamp-frame"
          title="Flanguage music on Bandcamp"
          loading="lazy"
          allow="autoplay"
        ></iframe>
      </div>

      <div id="touch-controls" aria-label="Touch controls">
        <div id="joystick" aria-label="Movement joystick">
          <div id="joystick-knob"></div>
        </div>

        <div id="character-controls" role="group" aria-label="Choose band member">
          <button type="button" data-character="0" aria-label="Play as Santi">S</button>
          <button type="button" data-character="1" aria-label="Play as Nick">N</button>
          <button type="button" data-character="2" aria-label="Play as Jake">J</button>
        </div>

        <div id="action-controls">
          <button id="touch-use" class="small-action" type="button" aria-label="Use, enter, or exit">USE</button>
          <button id="touch-skill" type="button" aria-label="Use instrument skill">FX</button>
          <button id="touch-jam" class="primary-action" type="button" aria-label="Play instrument">JAM</button>
        </div>
      </div>

      <div id="rotate-note" aria-hidden="true">ROTATE ↻</div>
      <div id="announcement" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="./game.js"></script>
  </body>
</html>
