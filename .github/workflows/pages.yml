name: Deploy Flangame to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble static game
        shell: bash
        run: |
          mkdir -p _site
          cp -a public/game/. _site/
          cat .github/pages-assets/baltimore-streets.json.gz.b64.* \
            | base64 --decode \
            | gzip --decompress \
            > _site/baltimore-streets.json
          touch _site/.nojekyll
      - name: Upload static game
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
